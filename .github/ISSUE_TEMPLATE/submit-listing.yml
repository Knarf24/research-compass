name: Submit a research opportunity
description: Tell us about a US undergraduate research program or lab opening. We check it before it goes live.
title: "[Listing] "
labels: ["listing"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping other students. Please only submit opportunities with a **public, official page** we can link to.
        Don't include anyone's personal email or phone number; the official page is enough.
  - type: input
    id: title
    attributes: { label: Program or position name }
    validations: { required: true }
  - type: input
    id: org
    attributes: { label: University, lab or organization }
    validations: { required: true }
  - type: input
    id: url
    attributes: { label: Official page (link), placeholder: "https://" }
    validations: { required: true }
  - type: input
    id: location
    attributes: { label: City and state, placeholder: "Durham, NC (or Remote)" }
  - type: input
    id: deadline
    attributes: { label: Application deadline, placeholder: "2027-02-15 (leave empty if rolling)" }
  - type: dropdown
    id: paid
    attributes: { label: Is it paid?, options: ["Yes", "No", "Not sure"] }
  - type: textarea
    id: summary
    attributes: { label: Short description in your own words (2-3 sentences) }
    validations: { required: true }
  - type: input
    id: eligibility
    attributes: { label: Who can apply?, placeholder: "e.g. sophomores and juniors, US citizens only" }
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: The information is public on the official page, and I wrote the description myself.
          required: true
