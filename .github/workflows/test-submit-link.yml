name: Test paste-a-link submission (temporary)
# Temporary, branch-only: sends links through the live paste-a-link endpoint the same way the
# website does, then reads the ntfy topic to confirm the phone alert went out.
on:
  push:
    branches: [claude/project-thread-9f4eue]
    paths: [".github/test-submit-links.txt", ".github/workflows/test-submit-link.yml"]
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit each link
        run: |
          while read -r url; do
            [ -z "$url" ] && continue
            echo "== $url"
            body=$(jq -n --arg u "$url" '{url:$u, note:"Sent by Claude for Frank (ntfy test)", website:""}')
            curl -sS -m 90 -w '\nHTTP %{http_code}\n' -X POST https://research-compass-ai-proxy.vercel.app/api/submit \
              -H 'Content-Type: application/json' -H 'Origin: https://research-compass.studentlabs.me' -d "$body" || true
            sleep 5
          done < .github/test-submit-links.txt
      - name: Read the ntfy topic (last 15 minutes)
        run: |
          sleep 5
          curl -sS -m 30 "https://ntfy.sh/research-compass-4999b20d0315/json?poll=1&since=15m" | jq -c '{time, title, message}' || true
