name: Check the live site
# Manual check: the site address answers over https, share pages have the right preview tags,
# and the AI helper accepts requests from the site.
on:
  workflow_dispatch:
    inputs:
      site:
        description: Site address
        default: https://research-compass.studentlabs.me/
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Site and share page
        env:
          SITE: ${{ inputs.site }}
        run: |
          set -e
          curl -sS -o /dev/null -w "home %{http_code} %{url_effective}\n" -L "$SITE"
          curl -sS -o /dev/null -w "data %{http_code}\n" "${SITE}data/listings.json"
          curl -sS "${SITE}sw.js" | head -2
          curl -sS "${SITE}" | grep -o "Paid research programs\|Filters and sort" | sort -u
          curl -sS -o page.html -w "share %{http_code}\n" "${SITE}p/stanford-surf/"
          grep -o '<meta property="og:[a-z]*" content="[^"]*"' page.html
          curl -sS -o /dev/null -w "missing %{http_code}\n" "${SITE}p/no-such-program/"
          curl -sS -o /dev/null -w "og.png %{http_code} %{content_type} %{size_download} bytes\n" "${SITE}og.png"
      - name: AI helper accepts the site
        env:
          SITE: ${{ inputs.site }}
        run: |
          ORIGIN=$(python3 -c 'import os,urllib.parse as u; p=u.urlparse(os.environ["SITE"]); print(f"{p.scheme}://{p.netloc}")')
          curl -sS -m 90 -X POST https://research-compass-ai-proxy.vercel.app/api/draft \
            -H "Origin: $ORIGIN" -H "Content-Type: application/json" -D headers.txt \
            -d '{"profile":{"name":"Sample Student","major":"Computer science","year":"Junior"},"target":{"type":"program","title":"SURF","org":"NIST","summary":"Paid summer research."},"kind":"intro"}' \
            -w "\nHTTP %{http_code}\n" | tee out.txt
          grep -i "access-control-allow-origin" headers.txt
          grep -q "HTTP 200" out.txt
      - name: Visitor counter (Vercel Web Analytics)
        env:
          SITE: ${{ inputs.site }}
        run: |
          curl -sS "${SITE}" | grep -o '_vercel/insights/script.js' | head -1
          curl -sS -o /dev/null -w "counter script %{http_code}\n" "${SITE}_vercel/insights/script.js"
          npm i --no-save --silent playwright@1.49.1 >/dev/null && npx --yes playwright@1.49.1 install --with-deps chromium >/dev/null 2>&1
          cat > visit.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          const p = await b.newPage();
          const sent = [];
          p.on("response", (r) => { if (r.url().includes("/_vercel/insights/")) sent.push(`${r.request().method()} ${new URL(r.url()).pathname} ${r.status()}`); });
          await p.goto(process.env.SITE, { waitUntil: "networkidle" });
          await p.waitForTimeout(3000);
          console.log(sent.join("\n") || "no counter requests");
          await b.close();
          if (!sent.some((s) => s.startsWith("POST") && s.endsWith(" 200"))) process.exit(1);
          JS
          node visit.mjs
