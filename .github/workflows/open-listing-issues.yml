name: Open listing issues (temporary)
# Temporary, branch-only: opens one "[Listing]" issue per entry in .github/new-listings.json
# (links Frank shared, details checked by hand). Nothing is published until the owner adds `approved`.
on:
  push:
    branches: [claude/project-thread-9f4eue]
    paths: [".github/new-listings.json"]
permissions:
  issues: write
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(jq length .github/new-listings.json)
          for i in $(seq 0 $((n-1))); do
            jq -r ".[$i].title" .github/new-listings.json > t.txt
            jq -r ".[$i].body" .github/new-listings.json > b.txt
            gh issue create -R "$GITHUB_REPOSITORY" --title "$(cat t.txt)" --body-file b.txt --label listing
            sleep 2
          done
